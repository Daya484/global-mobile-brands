steps:

# ───────────────────────────────────────────
# 1. BUILD & PUSH IMAGES
# ───────────────────────────────────────────

- name: gcr.io/cloud-builders/docker
  id: build-ingestion
  args:
    [
      "build",
      "-t", "${_REGISTRY}/mb-ingestion:$SHORT_SHA",
      "-t", "${_REGISTRY}/mb-ingestion:latest",
      "./ingestion"
    ]

- name: gcr.io/cloud-builders/docker
  id: push-ingestion
  args: ["push", "--all-tags", "${_REGISTRY}/mb-ingestion"]
  waitFor: ["build-ingestion"]


- name: gcr.io/cloud-builders/docker
  id: build-transform
  args:
    [
      "build",
      "-t", "${_REGISTRY}/mb-transform:$SHORT_SHA",
      "-t", "${_REGISTRY}/mb-transform:latest",
      "./transform"
    ]

- name: gcr.io/cloud-builders/docker
  id: push-transform
  args: ["push", "--all-tags", "${_REGISTRY}/mb-transform"]
  waitFor: ["build-transform"]


- name: gcr.io/cloud-builders/docker
  id: build-archival
  args:
    [
      "build",
      "-t", "${_REGISTRY}/mb-archival:$SHORT_SHA",
      "-t", "${_REGISTRY}/mb-archival:latest",
      "./archival"
    ]

- name: gcr.io/cloud-builders/docker
  id: push-archival
  args: ["push", "--all-tags", "${_REGISTRY}/mb-archival"]
  waitFor: ["build-archival"]


# ───────────────────────────────────────────
# 2. DEPLOY CLOUD RUN JOBS
# ───────────────────────────────────────────

- name: gcr.io/cloud-builders/gcloud
  id: deploy-ingestion
  args:
    [
      "run","jobs","deploy","${_ENV}-mb-ingestion",
      "--image=${_REGISTRY}/mb-ingestion:$SHORT_SHA",
      "--region=${_REGION}",
      "--project=${_PROJECT_ID}",
      "--service-account=${_SA_EMAIL}",
      "--set-env-vars=BUCKET_NAME=${_SOURCE_BUCKET},PROJECT_ID=${_PROJECT_ID}",
      "--max-retries=3",
      "--tasks=1"
    ]
  waitFor: ["push-ingestion"]


- name: gcr.io/cloud-builders/gcloud
  id: deploy-transform
  args:
    [
      "run","jobs","deploy","${_ENV}-mb-transform",
      "--image=${_REGISTRY}/mb-transform:$SHORT_SHA",
      "--region=${_REGION}",
      "--project=${_PROJECT_ID}",
      "--service-account=${_SA_EMAIL}",
      "--set-env-vars=BUCKET_NAME=${_SOURCE_BUCKET},PROJECT_ID=${_PROJECT_ID}",
      "--max-retries=3",
      "--tasks=1"
    ]
  waitFor: ["push-transform"]


- name: gcr.io/cloud-builders/gcloud
  id: deploy-archive
  args:
    [
      "run","jobs","deploy","${_ENV}-mb-archive",
      "--image=${_REGISTRY}/mb-archival:$SHORT_SHA",
      "--region=${_REGION}",
      "--project=${_PROJECT_ID}",
      "--service-account=${_SA_EMAIL}",
      "--set-env-vars=BUCKET_NAME=${_SOURCE_BUCKET},PROJECT_ID=${_PROJECT_ID}",
      "--max-retries=3",
      "--tasks=1"
    ]
  waitFor: ["push-archival"]


# ───────────────────────────────────────────
# 3. SYNC DATAPROC SCRIPTS
# ───────────────────────────────────────────

- name: gcr.io/cloud-builders/gcloud
  id: sync-scripts
  args:
    [
      "storage","cp",
      "dataproc_jobs/",
      "gs://${_PIPELINE_BUCKET}/scripts/",
      "--recursive"
    ]


# ───────────────────────────────────────────
# 4. SYNC AIRFLOW DAG
# ───────────────────────────────────────────

- name: gcr.io/cloud-builders/gcloud
  id: sync-dag
  args:
    [
      "storage","cp",
      "airflow/",
      "gs://${_COMPOSER_BUCKET}/dags/",
      "--recursive"
    ]


# ───────────────────────────────────────────
# SUBSTITUTIONS
# ───────────────────────────────────────────
substitutions:
  _ENV:             "dv"            # change to prod for PROD
  _REGION:          "us-central1"
  _PROJECT_ID:      "dv-env"
  _REGISTRY:        "us-central1-docker.pkg.dev/dv-env/mb-repo"
  _SA_EMAIL:        "mb-pipeline-sa@dv-env.iam.gserviceaccount.com"
  _SOURCE_BUCKET:   "dv-mb-data-bucket"      # bucket holding landing/ & transformed/ — update to real name
  _PIPELINE_BUCKET: "dv-mb-pipeline-bucket"  # bucket holding scripts/, bronze/, silver/, gold/
  _COMPOSER_BUCKET: "us-central1-dv-mb-composer-XXXX" # update to your real Composer bucket

options:
  logging: CLOUD_LOGGING_ONLY